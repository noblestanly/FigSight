{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Columns • FigSight</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="{% static 'js/select_columns.js' %}" defer></script>
</head>
<body>
  <!-- Shared Header -->
  <header>
    <div class="container header">
      <a href="/" class="logo">
        <img src="{% static 'img/logo.png' %}" alt="FigSight Logo">
      </a>
      <!-- no nav on this page -->
    </div>
  </header>

  <!-- Loader -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
    <div class="loader-text">Processing…</div>
  </div>

  <main class="container">
    <h1 class="page-title">Select Columns</h1>

    <div class="card">
      <h3>Filter Columns</h3>
      <form id="filterColumnsForm" class="chips"></form>
    </div>

    <div class="card">
      <h3>Graph Configuration (optional)</h3>
      <label class="label">Chart Type</label>
      <select id="chartType" class="input">
        <option value="">None</option>
        <option value="bar">Bar</option>
        <option value="line">Line</option>
        <option value="pie">Pie</option>
      </select>
      <div id="graphOptions" class="grid-2"></div>
    </div>

    <div class="actions">
      <button id="proceedBtn" class="btn btn-blue" disabled>Proceed to Dashboard</button>
    </div>
  </main>
</body>
</html>
